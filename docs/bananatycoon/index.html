<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Tycoon</title>
    <style>
        :root {
            --bg-dark: #14240f;
            --bg-mid: #24381a;
            --bg-light: #38732e;
            --card-bg: rgba(20, 36, 15, 0.9);
            --text: #f2ebbf;
            --muted: #bfd9b2;
            --accent: #d19429;
            --accent-hover: #ffdb57;
            --accent-text: #1f1805;
            --border: rgba(255, 219, 87, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(56, 115, 46, 0.35), transparent 40%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-dark)),
                url("MainLogo_background.png") center center / 260px repeat;
        }

        .card {
            width: 100%;
            max-width: 760px;
            padding: 40px 32px 24px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--card-bg);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .logo {
            width: min(220px, 55vw);
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.35));
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
        }

        .intro {
            margin: 0 0 32px;
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .message {
            margin: 0 0 20px;
            font-size: 1.15rem;
            line-height: 1.5;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-weight: bold;
        }

        .store-buttons {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .store-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            min-width: 200px;
            padding: 10px 18px 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            background: #111;
            color: #fff;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
        }

        .store-btn:hover,
        .store-btn:focus-visible {
            background: #1a1a1a;
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.34);
        }

        .store-btn--soon {
            cursor: default;
            opacity: 0.72;
        }

        .store-btn--soon:hover,
        .store-btn--soon:focus-visible {
            background: #111;
            transform: none;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
        }

        .store-btn-icon {
            flex: 0 0 28px;
            width: 28px;
            height: 28px;
        }

        .store-btn-copy {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.15;
            text-align: left;
        }

        .store-btn-label {
            font-size: 0.68rem;
            letter-spacing: 0.01em;
            opacity: 0.92;
        }

        .store-btn-name {
            font-size: 1.05rem;
            font-weight: bold;
        }

        footer {
            margin-top: 48px;
            font-size: 0.95rem;
            color: var(--muted);
        }

        footer a {
            color: inherit;
            text-decoration: none;
        }

        footer a:hover,
        footer a:focus-visible {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="MainLogo_foreground.png" alt="Banana Tycoon logo">
        <h1>Banana Tycoon</h1>
        <p class="intro">Build your banana empire in a world of jungle finance, upgrades, and big golden ambitions.</p>
        <p class="message">Play for free</p>
        <div class="store-buttons">
            <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.happs.bananatycoon&pcampaignid=web_share" target="_blank" rel="noopener noreferrer">
                <svg class="store-btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#00D7FF" d="M3 20.5V3.5C3 2.91 3.34 2.39 3.84 2.15L13.69 12 3.84 21.85C3.34 21.6 3 21.09 3 20.5Z"/>
                    <path fill="#FFD300" d="M16.81 15.12 6.05 21.34l8.49-8.49 2.27 2.27Z"/>
                    <path fill="#FF3A44" d="M20.16 10.81c.34.27.59.69.59 1.19s-.22.92-.57 1.19l-2.29 1.32-2.5-2.5 2.5-2.5 2.27 1.4Z"/>
                    <path fill="#00F076" d="M6.05 2.66 16.81 8.88 14.54 11.15 6.05 2.66Z"/>
                </svg>
                <span class="store-btn-copy">
                    <span class="store-btn-label">Get it on</span>
                    <span class="store-btn-name">Google Play</span>
                </span>
            </a>
            <div class="store-btn store-btn--soon" aria-label="iOS version coming soon">
                <svg class="store-btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#fff" d="M16.8 12.4c-.1-2.4 2-3.5 2.1-3.6-1.1-1.7-2.9-1.9-3.5-2-1.5-.2-2.9.9-3.7.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.9 1.3 1.9 2.7 3.3 2.7 1.3 0 1.7-.9 3.2-.9 1.5 0 1.9.9 3.2.9 1.4 0 2.3-1.3 3.2-2.6 1-1.5 1.4-2.9 1.4-3 0 0-2.7-1-2.7-4z"/>
                    <path fill="#fff" d="M14.6 4.8c.7-.9 1.2-2.1 1.1-3.3-1.1.1-2.4.7-3.1 1.6-.7.8-1.2 2-1 3.2 1.2.1 2.4-.6 3-1.5z"/>
                </svg>
                <span class="store-btn-copy">
                    <span class="store-btn-label">Coming soon on</span>
                    <span class="store-btn-name">App Store</span>
                </span>
            </div>
        </div>

        <footer>
            <a href="privacypolicy/">Privacy Policy</a>
        </footer>
    </main>
</body>
</html>
